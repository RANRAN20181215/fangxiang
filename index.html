<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>认识方向 - 冉冉的数学乐园</title>
<style>
  :root{
    --font-family:'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif;
    --c-n:#e74c3c; --c-e:#f39c12; --c-s:#3498db; --c-w:#27ae60;
    --ink:#2c3e50; --muted:#8a9aa8; --line:#e8edf2;
    --ok:#2ecc71; --no:#e74c3c;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:var(--font-family);
    background:linear-gradient(160deg,#e8f4ff 0%,#fdf3e3 55%,#eaf7ee 100%);
    min-height:100vh; padding:20px; color:var(--ink);
  }
  .wrap{max-width:1060px;margin:0 auto;background:#fff;border-radius:30px;
    box-shadow:0 18px 50px rgba(31,58,88,.13);padding:26px 30px 34px;}
  header{text-align:center;margin-bottom:18px;}
  h1{font-size:30px;color:#2f6fb5;letter-spacing:2px;}
  .sub{font-size:15px;color:var(--muted);margin-top:6px;}
  .tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 22px;}
  .tabs button{
    font-family:inherit;font-size:15px;font-weight:700;color:#7b8b99;
    background:#f7f9fb;border:2px solid var(--line);border-radius:14px;
    padding:9px 16px;cursor:pointer;transition:.18s;display:flex;align-items:center;gap:7px;
  }
  .tabs button:hover{transform:translateY(-2px);}
  .tabs button.on{background:#eaf3ff;border-color:#5b9bd5;color:#2f6fb5;box-shadow:0 4px 12px rgba(91,155,213,.2);}
  .tabs .badge{width:20px;height:20px;border-radius:50%;background:#dfe8f0;color:#fff;
    font-size:12px;display:flex;align-items:center;justify-content:center;}
  .tabs button.on .badge{background:#5b9bd5;}
  .tabs .star{font-size:12px;color:#f0b429;}

  .level{display:none;}
  .level.on{display:block;animation:fade .3s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .stage{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1fr);gap:26px;align-items:start;}
  @media (max-width:820px){.stage{grid-template-columns:1fr;}}

  .visual{background:#fafcfe;border:2px solid var(--line);border-radius:22px;padding:18px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:360px;position:relative;}

  /* ---------- 罗盘 ---------- */
  .dial{width:320px;height:320px;position:relative;flex:none;}
  .dial .circle{position:absolute;inset:0;border-radius:50%;background:
     radial-gradient(circle at 50% 42%,#ffffff 0%,#f2f8ff 55%,#e4eef9 100%);
     border:3px solid #d7e5f2;box-shadow:inset 0 0 26px rgba(120,160,200,.16);}
  .dial .tick{position:absolute;width:2px;height:14px;background:#c3d5e4;left:calc(50% - 1px);top:8px;transform-origin:50% 152px;}
  .rl{position:absolute;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:800;color:#fff;}
  .rl.n{background:var(--c-n);left:calc(50% - 23px);top:14px;}
  .rl.s{background:var(--c-s);left:calc(50% - 23px);bottom:14px;}
  .rl.e{background:var(--c-e);right:14px;top:calc(50% - 23px);}
  .rl.w{background:var(--c-w);left:14px;top:calc(50% - 23px);}
  .needle{position:absolute;inset:0;transform:rotate(var(--rot,0deg));transition:transform .85s cubic-bezier(.34,1.3,.64,1);}
  .shaft{position:absolute;left:calc(50% - 8px);top:33%;width:16px;height:18%;background:#f6a623;border-radius:8px;}
  .head{position:absolute;left:calc(50% - 19px);top:23%;width:0;height:0;
    border-left:19px solid transparent;border-right:19px solid transparent;border-bottom:34px solid #f6a623;}
  .kid{position:absolute;left:calc(50% - 26px);top:calc(50% - 26px);width:52px;height:52px;border-radius:50%;
    background:#fff;border:3px solid #cfe0ee;display:flex;align-items:center;justify-content:center;font-size:28px;
    box-shadow:0 4px 12px rgba(100,140,180,.18);}
  .hl{position:absolute;width:44px;height:44px;display:flex;align-items:center;justify-content:center;}
  .hl.f{left:calc(50% - 22px);top:62px;}
  .hl.b{left:calc(50% - 22px);bottom:62px;}
  .hl.l{left:62px;top:calc(50% - 22px);}
  .hl.r{right:62px;top:calc(50% - 22px);}
  .hl-t{display:flex;align-items:center;justify-content:center;width:100%;height:100%;
    font-size:15px;font-weight:800;color:#fff;border-radius:50%;
    transform:rotate(calc(var(--rot,0deg) * -1));transition:transform .85s cubic-bezier(.34,1.3,.64,1);}
  .hl.f .hl-t{background:#8e44ad;}
  .hl.b .hl-t{background:#b0b8c1;}
  .hl.l .hl-t{background:#16a085;}
  .hl.r .hl-t{background:#d35400;}
  .dial.hidehl .hl{opacity:0;transform:scale(.6);transition:opacity .25s,transform .25s;}
  .dial.showhl .hl{opacity:1;transform:none;}

  /* ---------- 地图 ---------- */
  .mapbox{position:relative;padding:44px 8px 8px;width:100%;}
  .rose{position:absolute;right:0;top:2px;width:38px;height:38px;border-radius:50%;
    background:#fff;border:2px solid #e2ecf5;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:var(--c-n);}
  .rose::before{content:'';position:absolute;top:-9px;left:50%;margin-left:-6px;
    border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--c-n);}
  .rose::after{content:'北';font-size:12px;font-weight:800;color:var(--c-n);}
  .map{display:grid;gap:10px;width:100%;}
  .mcell{min-height:84px;border-radius:16px;background:#fff;border:2px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.2s;}
  .mcell.empty{background:transparent;border:2px dashed #eef3f8;}
  .me{font-size:26px;line-height:1;}
  .mn{font-size:12px;color:#6b7b89;font-weight:700;}
  .mcell.hot{border-color:#5b9bd5;background:#eef6ff;box-shadow:0 0 0 4px rgba(91,155,213,.14);}
  .mcell.ok{border-color:var(--ok);background:#eafaf0;}
  .mcell.no{border-color:var(--no);background:#fdeeee;}

  /* ---------- 题目区 ---------- */
  .qa{display:flex;flex-direction:column;gap:14px;}
  .qcard{background:#f8fbff;border:2px solid #e3eefa;border-radius:20px;padding:20px 18px;font-size:19px;line-height:1.9;min-height:110px;}
  .qcard b{color:#2f6fb5;font-size:22px;padding:0 3px;}
  .qcard .bl{display:inline-block;min-width:64px;height:36px;line-height:32px;text-align:center;
    border-bottom:3px solid #9dbfe0;color:#bbb;font-weight:800;margin:0 4px;vertical-align:middle;}
  .qcard .bl.on{border-bottom-color:#f0b429;}
  .qcard .bl.filled{color:#e07b00;border-bottom-color:#f0b429;}
  .opts{display:flex;gap:10px;flex-wrap:wrap;}
  .opts button{font-family:inherit;font-size:19px;font-weight:800;color:#fff;border:none;
    border-radius:16px;padding:13px 0;width:88px;cursor:pointer;transition:.16s;box-shadow:0 5px 14px rgba(0,0,0,.09);}
  .opts button:hover{transform:translateY(-3px);box-shadow:0 9px 20px rgba(0,0,0,.14);}
  .opts button:disabled{opacity:.45;cursor:default;transform:none;}
  .o-n{background:var(--c-n);} .o-e{background:var(--c-e);} .o-s{background:var(--c-s);} .o-w{background:var(--c-w);}
  .o-pick{background:#8e44ad;}
  .fb{min-height:56px;font-size:16px;line-height:1.75;border-radius:14px;padding:0 14px;transition:.2s;}
  .fb.show{padding:12px 14px;}
  .fb.ok{background:#eafaf0;border:2px solid #a8e6c0;color:#1e8449;}
  .fb.no{background:#fdeeee;border:2px solid #f5b7b1;color:#b03a2e;}
  .fb b{color:#c0392b;}
  .fb.ok b{color:#1e8449;}
  .actions{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{font-family:inherit;font-size:15px;font-weight:700;border-radius:13px;padding:10px 18px;
    cursor:pointer;transition:.16s;border:2px solid #dfe9f2;background:#fff;color:#5c6b78;}
  .btn:hover{transform:translateY(-2px);}
  .btn.primary{background:#5b9bd5;border-color:#5b9bd5;color:#fff;}
  .btn.warm{background:#f0b429;border-color:#f0b429;color:#fff;}
  .scores{font-size:14px;color:var(--muted);font-weight:700;}

  /* ---------- 拼图 ---------- */
  .slots{display:grid;grid-template-columns:repeat(3,84px);grid-template-rows:repeat(3,84px);gap:8px;}
  .slot{border:2px dashed #cfdde9;border-radius:14px;background:#fbfdff;display:flex;
    flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.16s;gap:1px;}
  .slot:hover{background:#eef6ff;border-color:#9dbfe0;}
  .slot.filled{border-style:solid;background:#fff;border-color:#b8d4ea;box-shadow:0 3px 10px rgba(120,160,200,.14);}
  .slot.sel{border-color:#f0b429;box-shadow:0 0 0 4px rgba(240,180,41,.22);}
  .slot.ok{border-color:var(--ok);background:#eafaf0;}
  .slot.no{border-color:var(--no);background:#fdeeee;animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .se{font-size:24px;line-height:1;}
  .sn{font-size:11px;font-weight:700;color:#5c6b78;}
  .tray{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center;min-height:56px;}
  .chip{background:#fff;border:2px solid #dfe9f2;border-radius:12px;padding:7px 11px;cursor:pointer;
    font-size:13px;font-weight:800;color:#4a5a68;display:flex;align-items:center;gap:5px;transition:.16s;}
  .chip:hover{transform:translateY(-2px);border-color:#9dbfe0;}
  .chip.sel{border-color:#f0b429;background:#fff8e6;box-shadow:0 0 0 3px rgba(240,180,41,.2);}
  .chip .ce{font-size:17px;}
  .clues{list-style:none;display:flex;flex-direction:column;gap:7px;}
  .clues li{font-size:15px;line-height:1.6;padding:7px 12px;background:#fff;border-radius:11px;
    border-left:5px solid #cfe0ee;color:#3d4b58;transition:.2s;}
  .clues li.hint{border-left-color:#f0b429;background:#fffaf0;}
  .clues li b{color:#2f6fb5;}

  /* ---------- 反方向图 ---------- */
  .oppbox{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .oppttl{font-size:19px;font-weight:800;color:#2f6fb5;letter-spacing:1px;}
  .opprow{display:flex;align-items:center;gap:14px;}
  .oline{width:96px;height:4px;border-radius:2px;background:linear-gradient(90deg,#dfe9f2,#b9cee0,#dfe9f2);position:relative;}
  .oline::before,.oline::after{content:'';position:absolute;top:-5px;border-top:7px solid transparent;border-bottom:7px solid transparent;}
  .oline::before{left:-2px;border-right:9px solid #b9cee0;}
  .oline::after{right:-2px;border-left:9px solid #b9cee0;}
  .od{width:56px;height:56px;border-radius:50%;color:#fff;font-size:21px;font-weight:800;
    display:flex;align-items:center;justify-content:center;}
  .od.n{background:var(--c-n);} .od.s{background:var(--c-s);}
  .od.e{background:var(--c-e);} .od.w{background:var(--c-w);}
  .opptip{font-size:14px;color:#8a9aa8;line-height:1.7;max-width:260px;}
  .maphint{font-size:14px;color:#7b8b99;text-align:center;margin-bottom:10px;line-height:1.6;}

  /* ---------- 面对面 ---------- */
  .scene{position:relative;width:100%;height:344px;}
  .plegend{position:absolute;left:0;top:4px;display:flex;gap:10px;z-index:5;}
  .plegend span{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:#4a5a68;
    background:#fff;border:2px solid #e8edf2;border-radius:10px;padding:3px 10px;}
  .plegend i{width:10px;height:10px;border-radius:50%;display:block;}
  .pbox{position:absolute;inset:0;}
  .psn{position:absolute;transform:translate(-50%,-50%);width:70px;text-align:center;}
  .pwrap{position:relative;width:62px;height:62px;margin:0 auto;}
  .phead{position:relative;z-index:2;width:62px;height:62px;border-radius:50%;background:#f7fafd;
    border:3px solid var(--pc,#5b9bd5);display:flex;align-items:center;justify-content:center;
    font-size:30px;box-shadow:0 4px 12px rgba(100,140,180,.2);}
  .parr{position:absolute;inset:0;z-index:1;}
  .parr i{position:absolute;left:calc(50% + 33px);top:calc(50% - 8px);width:0;height:0;
    border-left:14px solid var(--pc,#5b9bd5);border-top:8px solid transparent;border-bottom:8px solid transparent;}
  .hand{position:absolute;z-index:3;font-size:10px;font-weight:800;color:#fff;background:#94a3b1;
    border-radius:8px;padding:1px 5px;white-space:nowrap;transform:translate(-50%,-50%);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="pageTitle">认识方向</h1>
    <div class="sub" id="pageSub">转一转、看一看，东南西北就分清啦</div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-lv="1" class="on"><span class="badge">1</span>认方向 <span class="star" id="s1"></span></button>
    <button data-lv="2"><span class="badge">2</span>找方向 <span class="star" id="s2"></span></button>
    <button data-lv="3"><span class="badge">3</span>走一走 <span class="star" id="s3"></span></button>
    <button data-lv="4"><span class="badge">4</span>反一反 <span class="star" id="s4"></span></button>
    <button data-lv="5"><span class="badge">5</span>画平面图 <span class="star" id="s5"></span></button>
    <button data-lv="6"><span class="badge">6</span>面对面 <span class="star" id="s6"></span></button>
  </nav>

  <!-- ============ 关卡1 ============ -->
  <section class="level on" id="lv1">
    <div class="stage">
      <div class="visual">
        <div class="dial hidehl" id="dial" style="--rot:180deg">
          <div class="circle"></div>

          <span class="rl n">北</span>
          <span class="rl e">东</span>
          <span class="rl s">南</span>
          <span class="rl w">西</span>
          <div class="needle" id="needle">
            <div class="shaft"></div>
            <div class="head"></div>
            <div class="hl f"><span class="hl-t">前</span></div>
            <div class="hl b"><span class="hl-t">后</span></div>
            <div class="hl l"><span class="hl-t">左</span></div>
            <div class="hl r"><span class="hl-t">右</span></div>
          </div>
          <div class="kid">🧒</div>
        </div>
      </div>
      <div class="qa">
        <div class="qcard" id="q1"></div>
        <div class="opts" id="o1"></div>
        <div class="fb" id="f1"></div>
        <div class="actions">
          <button class="btn primary" id="n1">下一题</button>
          <span class="scores" id="sc1">答对 0 / 0</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 关卡2 ============ -->
  <section class="level" id="lv2">
    <div class="stage">
      <div class="visual"><div class="mapbox" id="map2"></div></div>
      <div class="qa">
        <div class="qcard" id="q2"></div>
        <div class="opts" id="o2"></div>
        <div class="fb" id="f2"></div>
        <div class="actions">
          <button class="btn primary" id="n2">下一题</button>
          <span class="scores" id="sc2">答对 0 / 0</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 关卡3 ============ -->
  <section class="level" id="lv3">
    <div class="stage">
      <div class="visual"><div class="mapbox" id="map3"></div></div>
      <div class="qa">
        <div class="qcard" id="q3"></div>
        <div class="opts" id="o3"></div>
        <div class="fb" id="f3"></div>
        <div class="actions">
          <button class="btn primary" id="n3">下一题</button>
          <span class="scores" id="sc3">答对 0 / 0</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 关卡4 ============ -->
  <section class="level" id="lv4">
    <div class="stage">
      <div class="visual">
        <div class="oppbox">
          <div class="oppttl">反方向就是"正对面"</div>
          <div class="opprow"><span class="od n">北</span><span class="oline"></span><span class="od s">南</span></div>
          <div class="opprow"><span class="od e">东</span><span class="oline"></span><span class="od w">西</span></div>
          <div class="opptip">问"反一反"的时候，方向也跟着反过来</div>
        </div>
      </div>
      <div class="qa">
        <div class="qcard" id="q4"></div>
        <div class="opts" id="o4"></div>
        <div class="fb" id="f4"></div>
        <div class="actions">
          <button class="btn primary" id="n4">下一题</button>
          <span class="scores" id="sc4">答对 0 / 0</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 关卡5 ============ -->
  <section class="level" id="lv5">
    <div class="stage">
      <div class="visual">
        <div class="maphint">先点下面的建筑，再点格子放进去<br>放错了就再点一下那个格子拿回来</div>
        <div class="mapbox">
          <div class="rose"></div>
          <div class="slots" id="l5Slots"></div>
        </div>
        <div class="tray" id="l5Tray"></div>
      </div>
      <div class="qa">
        <ul class="clues" id="l5Clues"></ul>
        <div class="fb" id="f5"></div>
        <div class="actions">
          <button class="btn warm" id="l5Check">检查</button>
          <button class="btn" id="l5Hint">给我一个提示</button>
          <button class="btn" id="l5Reset">重新来</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 关卡6 ============ -->
  <section class="level" id="lv6">
    <div class="stage">
      <div class="visual">
        <div class="scene">
          <div class="plegend">
            <span><i style="background:#5b9bd5"></i>小明</span>
            <span><i style="background:#e8749b"></i>小红</span>
          </div>
          <div class="rose"></div>
          <div class="pbox" id="pb6"></div>
        </div>
      </div>
      <div class="qa">
        <div class="qcard" id="q6"></div>
        <div class="opts" id="o6"></div>
        <div class="fb" id="f6"></div>
        <div class="actions">
          <button class="btn primary" id="n6">下一题</button>
          <span class="scores" id="sc6">答对 0 / 0</span>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";
  var DATA = {};
  try { DATA = JSON.parse(document.getElementById('lesson-data').textContent); } catch(e){ DATA = {}; }

  var DIRS = ['北','东','南','西'];
  var CLS  = ['n','e','s','w'];
  var OPP  = {北:'南',南:'北',东:'西',西:'东'};
  var $ = function(id){ return document.getElementById(id); };
  var rnd = function(n){ return Math.floor(Math.random()*n); };
  var pick = function(a){ return a[rnd(a.length)]; };
  var norm = function(d){ d = ((d % 360) + 360) % 360; return d; };
  var dirOf = function(d){ return DIRS[Math.round(norm(d)/90) % 4]; };

  if (DATA.title) $('pageTitle').textContent = DATA.title;
  if (DATA.subtitle) $('pageSub').textContent = DATA.subtitle;

  function shuffle(a){
    var b = a.slice();
    for (var i=b.length-1;i>0;i--){ var j=rnd(i+1); var t=b[i]; b[i]=b[j]; b[j]=t; }
    return b;
  }

  /* ---------------- tabs ---------------- */
  var current = 1;
  $('tabs').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-lv]');
    if (!btn) return;
    go(parseInt(btn.dataset.lv,10));
  });
  function go(lv){
    current = lv;
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(b){
      b.classList.toggle('on', parseInt(b.dataset.lv,10) === lv);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.level'), function(s){
      s.classList.toggle('on', s.id === 'lv'+lv);
    });
    if (lv===1 && !l1.init) { l1.init = true; l1Next(); }
    if (lv===2 && !l2.init) { l2.init = true; l2Next(); }
    if (lv===3 && !l3.init) { l3.init = true; l3Next(); }
    if (lv===4 && !l4.init) { l4.init = true; l4Next(); }
    if (lv===5 && !l5.init) { l5.init = true; l5Render(); }
    if (lv===6 && !l6.init) { l6.init = true; l6Next(); }
  }

  function dirButtons(host, onPick, group){
    host.innerHTML = '';
    DIRS.forEach(function(d,i){
      var b = document.createElement('button');
      b.className = 'o-' + CLS[i];
      b.textContent = d;
      b.dataset.dir = d;
      b.addEventListener('click', function(){ onPick(d, b); });
      host.appendChild(b);
    });
  }

  function score(el, ok, total){
    el.textContent = '答对 ' + ok + ' / ' + total;
  }

  /* ================= 关卡1：认方向 ================= */
  var l1 = { facing:180, kind:'side', ask:'左', turnDir:'右', turnN:1, answered:false, ok:0, tot:0 };

  function l1Next(){
    l1.answered = false;
    l1.facing = pick([0,90,180,270]);
    if (Math.random() < 0.6){
      l1.kind = 'side';
      l1.ask = pick(['前','后','左','左','右','右']);
    } else {
      l1.kind = 'turn';
      l1.turnDir = Math.random() < 0.5 ? '右' : '左';
      l1.turnN = 1 + rnd(3);
    }
    var dial = $('dial');
    dial.classList.add('hidehl');
    dial.classList.remove('showhl');
    dial.style.setProperty('--rot', l1.facing + 'deg');

    if (l1.kind === 'side'){
      $('q1').innerHTML = '小朋友面朝 <b>' + dirOf(l1.facing) + '</b>，那么他的<b>' + l1.ask + '面</b>是哪个方向？';
    } else {
      $('q1').innerHTML = '小朋友面朝 <b>' + dirOf(l1.facing) + '</b>，向' + l1.turnDir + '转 <b>' + l1.turnN + '</b> 次，现在面朝哪个方向？';
    }
    $('f1').className = 'fb'; $('f1').innerHTML = '';
    dirButtons($('o1'), l1Pick, 'o1');
    Array.prototype.forEach.call($('o1').children, function(b){ b.disabled = false; });
  }

  function l1Truth(){
    if (l1.kind === 'side'){
      var off = {'前':0,'后':180,'左':-90,'右':90}[l1.ask];
      return dirOf(l1.facing + off);
    }
    var s = l1.turnDir === '右' ? 1 : -1;
    return dirOf(l1.facing + s * l1.turnN * 90);
  }

  function l1Pick(d, btn){
    if (l1.answered) return;
    l1.answered = true; l1.tot++;
    var truth = l1Truth();
    var fb = $('f1');
    Array.prototype.forEach.call($('o1').children, function(b){ b.disabled = true; });

    if (d === truth){
      l1.ok++;
      fb.className = 'fb show ok';
      fb.innerHTML = '✅ 对啦！' + (l1.kind === 'side'
        ? ('面朝 ' + dirOf(l1.facing) + ' 时，"' + l1.ask + '"就是 <b>' + truth + '</b>。' + l1Reason())
        : ('转了 ' + l1.turnN + ' 次，一共转了 ' + (l1.turnN*90) + '°，正好从 ' + dirOf(l1.facing) + ' 转到 <b>' + truth + '</b>。'));
    } else {
      fb.className = 'fb show no';
      fb.innerHTML = '❌ 正确答案是 <b>' + truth + '</b>。' + l1Reason();
    }
    revealDial();
    score($('sc1'), l1.ok, l1.tot);
  }

  function l1Reason(){
    var f = dirOf(l1.facing);
    if (l1.kind === 'turn'){
      return '面朝 ' + f + '，向右转就是顺时针转，转一次变一个方向：' + f + ' → ' + dirOf(l1.facing+90) + ' → ' + dirOf(l1.facing+180);
    }
    if (l1.ask === '前') return '前面 = 眼睛看的方向，就是 ' + f + '。';
    if (l1.ask === '后') return '后面 = 正对面，' + f + ' 的正对面是 ' + OPP[f] + '。';
    if (l1.ask === '左') return '记住：面朝北时，左手是西、右手是东；面朝 ' + f + ' 时左手就是 ' + dirOf(l1.facing-90) + '。';
    return '记住：面朝北时，右手是东；面朝 ' + f + ' 时右手就是 ' + dirOf(l1.facing+90) + '。';
  }

  function revealDial(){
    var dial = $('dial');
    if (l1.kind === 'turn'){
      dial.style.setProperty('--rot', (l1.facing + (l1.turnDir==='右'?1:-1) * l1.turnN * 90) + 'deg');
    }
    dial.classList.remove('hidehl');
    dial.classList.add('showhl');
  }

  $('n1').addEventListener('click', l1Next);

  /* ================= 地图工具 ================= */
  function manhattan(a,b){ return Math.abs(a.col-b.col) + Math.abs(a.row-b.row); }
  function dirFrom(a,b){
    if (a.col === b.col && a.row === b.row) return null;
    if (a.col === b.col) return b.row > a.row ? '南' : '北';
    if (a.row === b.row) return b.col > a.col ? '东' : '西';
    return null;
  }
  function byId(id){ return DATA.town.places.filter(function(p){ return p.id === id; })[0]; }

  function drawTown(host, highlight){
    var T = DATA.town;
    var cols = T.cols || 3, rows = T.rows || 3;
    host.innerHTML = '';
    var rose = document.createElement('div'); rose.className = 'rose'; host.appendChild(rose);
    var grid = document.createElement('div');
    grid.className = 'map';
    grid.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';
    grid.style.gridTemplateRows = 'repeat(' + rows + ',1fr)';
    for (var r=0;r<rows;r++){
      for (var c=0;c<cols;c++){
        var cell = document.createElement('div');
        cell.className = 'mcell';
        cell.dataset.key = c + ',' + r;
        cell.style.gridColumn = (c + 1);
        cell.style.gridRow = (r + 1);
        var p = T.places.filter(function(x){ return x.col===c && x.row===r; })[0];
        if (p){
          cell.dataset.id = p.id;
          cell.innerHTML = '<span class="me">' + p.emoji + '</span><span class="mn">' + p.name + '</span>';
          if (highlight && highlight.indexOf(p.id) >= 0) cell.classList.add('hot');
        } else {
          cell.classList.add('empty');
        }
        grid.appendChild(cell);
      }
    }
    host.appendChild(grid);
  }

  /* ================= 关卡2：找方向 ================= */
  var l2 = { A:null, B:null, answered:false, ok:0, tot:0, init:false };

  function l2Next(){
    var ps = DATA.town.places, A, B, guard = 0;
    do {
      B = pick(ps);
      var cands = ps.filter(function(p){
        return p.id !== B.id && (p.col === B.col || p.row === B.row);
      });
      A = pick(cands);
      guard++;
    } while ((!A || manhattan(A,B) > 2) && guard < 60);
    l2.A = A; l2.B = B; l2.answered = false;

    drawTown($('map2'), [A.id, B.id]);
    $('q2').innerHTML = '<b>' + A.name + '</b> 在 <b>' + B.name + '</b> 的哪一面？';
    $('f2').className = 'fb'; $('f2').innerHTML = '';
    dirButtons($('o2'), l2Pick);
    Array.prototype.forEach.call($('o2').children, function(b){ b.disabled = false; });
  }

  function l2Pick(d){
    if (l2.answered) return;
    l2.answered = true; l2.tot++;
    var truth = dirFrom(l2.B, l2.A);
    var fb = $('f2');
    Array.prototype.forEach.call($('o2').children, function(b){ b.disabled = true; });
    var cells = $('map2').querySelectorAll('.mcell');
    var ok = d === truth;
    if (ok) l2.ok++;
    Array.prototype.forEach.call(cells, function(c){
      if (c.dataset.id === l2.A.id || c.dataset.id === l2.B.id) c.classList.add(ok ? 'ok' : 'no');
    });
    fb.className = 'fb show ' + (ok ? 'ok' : 'no');
    fb.innerHTML = (ok ? '✅ 对！' : '❌ 正确答案是 <b>' + truth + '</b>。') +
      '站在 <b>' + l2.B.name + '</b> 往四面看，' + l2.A.name + ' 在它的' + truth + '边。' +
      '做这种题先找到"以谁为中心"，再往四面看。';
    score($('sc2'), l2.ok, l2.tot);
  }
  $('n2').addEventListener('click', l2Next);

  /* ================= 关卡3：走一走 ================= */
  var l3 = { r:null, blanks:['',''], active:0, answered:false, ok:0, tot:0, init:false };

  function l3Routes(){
    var ps = DATA.town.places, out = [];
    ps.forEach(function(A){
      ps.forEach(function(B){
        if (A.id === B.id || manhattan(A,B) !== 1) return;
        var d1 = dirFrom(A,B);
        ps.forEach(function(C){
          if (C.id === B.id || manhattan(B,C) !== 1) return;
          var d2 = dirFrom(B,C);
          if (d2 && d1 && d1 !== d2) out.push({A:A,B:B,C:C,d1:d1,d2:d2});
        });
      });
    });
    return out;
  }
  var ROUTES = null;

  function l3Next(){
    if (!ROUTES) ROUTES = l3Routes();
    if (!ROUTES.length) return;
    l3.r = pick(ROUTES);
    l3.blanks = ['','']; l3.active = 0; l3.answered = false;
    drawTown($('map3'), [l3.r.A.id, l3.r.C.id]);
    $('f3').className = 'fb'; $('f3').innerHTML = '';
    renderRoute();
  }

  function renderRoute(){
    var r = l3.r;
    var b1 = '<span class="bl ' + (l3.blanks[0] ? 'filled' : (l3.active===0 ? 'on':'')) + '">' + (l3.blanks[0] || '?') + '</span>';
    var b2 = '<span class="bl ' + (l3.blanks[1] ? 'filled' : (l3.active===1 ? 'on':'')) + '">' + (l3.blanks[1] || '?') + '</span>';
    $('q3').innerHTML = '从 <b>' + r.A.name + '</b> 出发，先向 ' + b1 + ' 走到 <b>' + r.B.name + '</b>，再向 ' + b2 + ' 走到 <b>' + r.C.name + '</b>。';
    $('f3').className = 'fb'; $('f3').innerHTML = '';
    dirButtons($('o3'), function(d, btn){
      if (l3.answered) return;
      l3.blanks[l3.active] = d;
      if (l3.active === 0) l3.active = 1;
      renderRoute();
      Array.prototype.forEach.call($('o3').children, function(b){ b.disabled = l3.answered; });
    });
    Array.prototype.forEach.call($('o3').children, function(b){
      b.disabled = l3.answered;
      if (l3.blanks.indexOf(b.dataset.dir) >= 0) b.style.opacity = '.45';
      else b.style.opacity = '1';
    });
    if (l3.blanks[0] && l3.blanks[1]) checkRoute();
  }

  function checkRoute(){
    var r = l3.r, fb = $('f3');
    var ok = l3.blanks[0] === r.d1 && l3.blanks[1] === r.d2;
    l3.answered = true; l3.tot++;
    if (ok) l3.ok++;
    fb.className = 'fb show ' + (ok ? 'ok' : 'no');
    fb.innerHTML = ok
      ? '✅ 走对啦！一步一步看：' + r.A.name + ' →（' + r.d1 + '）→ ' + r.B.name + ' →（' + r.d2 + '）→ ' + r.C.name + '。'
      : '❌ 应该是：先向 <b>' + r.d1 + '</b>，再向 <b>' + r.d2 + '</b>。一段一段看，别一次想两段。';
    score($('sc3'), l3.ok, l3.tot);
  }
  $('n3').addEventListener('click', l3Next);

  /* ================= 关卡4：反一反 ================= */
  var l4 = { q:null, pool:null, idx:0, answered:false, ok:0, tot:0, init:false };

  function l4Next(){
    if (!l4.pool){
      var src = (DATA.brain && DATA.brain.length) ? DATA.brain : [
        {q:'学校在书店的东面，那么书店在学校的（　）面。', a:'西', tip:'东和西是正对面，反过来问就反过来说。'},
        {q:'公园在超市的北面，那么超市在公园的（　）面。', a:'南', tip:'北和南是正对面。'}
      ];
      l4.pool = shuffle(src); l4.idx = 0;
    }
    if (l4.idx >= l4.pool.length) l4.pool = shuffle(l4.pool), l4.idx = 0;
    l4.q = l4.pool[l4.idx++];
    l4.answered = false;
    $('q4').innerHTML = l4.q.q;
    $('f4').className = 'fb'; $('f4').innerHTML = '';
    dirButtons($('o4'), l4Pick);
    Array.prototype.forEach.call($('o4').children, function(b){ b.disabled = false; });
  }

  function l4Pick(d){
    if (l4.answered) return;
    l4.answered = true; l4.tot++;
    var ok = d === l4.q.a;
    if (ok) l4.ok++;
    var fb = $('f4');
    Array.prototype.forEach.call($('o4').children, function(b){ b.disabled = true; });
    fb.className = 'fb show ' + (ok ? 'ok' : 'no');
    fb.innerHTML = (ok ? '✅ 对！' : '❌ 正确答案是 <b>' + l4.q.a + '</b>。') + l4.q.tip;
    score($('sc4'), l4.ok, l4.tot);
  }
  $('n4').addEventListener('click', l4Next);

  /* ================= 关卡5：画平面图 ================= */
  var l5 = { placed:{}, selected:null, wrong:0, init:false, done:false };

  function l5Render(){
    var C = DATA.campus;
    var slotsEl = $('l5Slots');
    slotsEl.innerHTML = '';
    C.buildings.forEach(function(b){
      var key = b.col + ',' + b.row;
      if (!(key in l5.placed)) l5.placed[key] = null;
    });
    var cells = {};
    C.buildings.forEach(function(b){ cells[b.col + ',' + b.row] = true; });

    Object.keys(cells).forEach(function(key){
      var cr = key.split(',');
      var div = document.createElement('div');
      div.className = 'slot';
      div.style.gridColumn = (parseInt(cr[0],10) + 1);
      div.style.gridRow = (parseInt(cr[1],10) + 1);
      div.dataset.key = key;
      var b = l5.placed[key];
      if (b){
        div.classList.add('filled');
        div.innerHTML = '<span class="se">' + b.emoji + '</span><span class="sn">' + b.name + '</span>';
      }
      div.addEventListener('click', function(){ l5Slot(key); });
      slotsEl.appendChild(div);
    });

    var tray = $('l5Tray');
    tray.innerHTML = '';
    var used = Object.keys(l5.placed).map(function(k){ return l5.placed[k] ? l5.placed[k].id : null; });
    C.buildings.forEach(function(b){
      if (used.indexOf(b.id) >= 0) return;
      var chip = document.createElement('div');
      chip.className = 'chip' + (l5.selected === b.id ? ' sel' : '');
      chip.innerHTML = '<span class="ce">' + b.emoji + '</span>' + b.name;
      chip.addEventListener('click', function(){
        l5.selected = (l5.selected === b.id) ? null : b.id;
        l5Render();
      });
      tray.appendChild(chip);
    });

    var clues = $('l5Clues');
    clues.innerHTML = '';
    C.clues.forEach(function(t, i){
      var li = document.createElement('li');
      li.innerHTML = '<b>' + '①②③④⑤⑥⑦⑧'[i] + '</b> ' + t;
      clues.appendChild(li);
    });
  }

  function l5Slot(key){
    var C = DATA.campus;
    if (l5.placed[key]){
      var b = l5.placed[key];
      l5.placed[key] = null;
      l5.selected = b.id;
      l5Render();
      return;
    }
    if (!l5.selected) return;
    var building = C.buildings.filter(function(x){ return x.id === l5.selected; })[0];
    l5.placed[key] = building;
    l5.selected = null;
    l5Render();
  }

  function l5Check(){
    var C = DATA.campus, right = 0, total = 0;
    var slots = $('l5Slots').querySelectorAll('.slot');
    Array.prototype.forEach.call(slots, function(s){ s.classList.remove('ok','no'); });
    C.buildings.forEach(function(b){
      total++;
      var key = b.col + ',' + b.row;
      var put = l5.placed[key];
      var s = $('l5Slots').querySelector('[data-key="' + key + '"]');
      if (put && put.id === b.id){ right++; if (s) s.classList.add('ok'); }
      else if (s) s.classList.add('no');
    });
    var fb = $('f5');
    if (right === total){
      fb.className = 'fb show ok';
      fb.innerHTML = '🎉 全对！7 个建筑都放对了。平面图的诀窍：先找最确定的那句（"大门在最南面"），再一句一句往外推。';
      $('s5').textContent = '⭐⭐⭐';
      l5.done = true;
    } else {
      l5.wrong++;
      fb.className = 'fb show no';
      fb.innerHTML = '现在是 <b>' + right + ' / ' + total + '</b> 个放对。红框是放错的，想想它到底在哪一句里。' +
        (l5.wrong >= 2 ? ' 点"给我一个提示"，我帮你放一个。' : '');
    }
  }

  function l5Hint(){
    var C = DATA.campus;
    for (var i=0;i<C.buildings.length;i++){
      var b = C.buildings[i];
      var key = b.col + ',' + b.row;
      var put = l5.placed[key];
      if (put && put.id === b.id) continue;
      Object.keys(l5.placed).forEach(function(k){
        if (l5.placed[k] && l5.placed[k].id === b.id) l5.placed[k] = null;
      });
      l5.placed[key] = b;
      l5Render();
      var items = $('l5Clues').children;
      var ci = -1;
      for (var j=0;j<C.clues.length;j++){
        if (C.clues[j].indexOf(b.name) >= 0){ items[j].classList.add('hint'); ci = j; break; }
      }
      $('f5').className = 'fb show ok';
      $('f5').innerHTML = '💡 <b>' + b.name + '</b> 放在这里。看第 ' + (ci + 1) + ' 句线索。';
      return;
    }
    $('f5').className = 'fb show ok';
    $('f5').innerHTML = '看起来已经放好了，点"检查"看看对不对。';
  }

  function l5Reset(){
    l5.placed = {}; l5.selected = null; l5.wrong = 0; l5.done = false;
    $('f5').className = 'fb'; $('f5').innerHTML = '';
    $('s5').textContent = '';
    l5Render();
  }

  $('l5Check').addEventListener('click', l5Check);
  $('l5Hint').addEventListener('click', l5Hint);
  $('l5Reset').addEventListener('click', l5Reset);

  /* ================= 关卡6：面对面 ================= */
  var l6 = { v:'face-facing', side:'left', dA:0, answer:'', answered:false, ok:0, tot:0, init:false };

  function svec(deg){ var r = deg * Math.PI / 180; return [Math.sin(r), -Math.cos(r)]; }

  function personEl(name, emoji, color, left, top, face, showHands){
    var wrap = document.createElement('div');
    wrap.className = 'psn';
    wrap.title = name;
    wrap.style.left = 'calc(50% + ' + left + ')';
    wrap.style.top = 'calc(50% + ' + top + ')';
    wrap.style.setProperty('--pc', color);
    var hands = '';
    if (showHands){
      var lf = svec(face - 90), rt = svec(face + 90);
      hands =
        '<span class="hand" style="left:calc(50% + ' + (lf[0]*40) + 'px);top:calc(50% + ' + (lf[1]*40) + 'px)">左·' + dirOf(face-90) + '</span>' +
        '<span class="hand" style="left:calc(50% + ' + (rt[0]*40) + 'px);top:calc(50% + ' + (rt[1]*40) + 'px)">右·' + dirOf(face+90) + '</span>';
    }
    wrap.innerHTML =
      '<div class="pwrap">' +
        '<span class="parr" style="transform:rotate(' + (face - 90) + 'deg)"><i></i></span>' +
        '<div class="phead">' + emoji + '</div>' +
        hands +
      '</div>';
    return wrap;
  }

  function l6Draw(showHands){
    var pb = $('pb6');
    pb.innerHTML = '';
    var dA = l6.dA, s = svec(dA), faceB = dA;
    if (l6.v === 'face-facing' || l6.v === 'face-left'){
      faceB = dA + 180;
    } else if (l6.v === 'back-facing'){
      s = svec(dA + 180); faceB = dA + 180;
    } else if (l6.v === 'side-by-side'){
      s = svec(dA + (l6.side === 'left' ? -90 : 90));
    } else {
      s = svec(dA + 180);
    }
    var sx = Math.round(s[0]), sy = Math.round(s[1]);
    var dx = sx === 0 ? '0%' : (sx > 0 ? '40%' : '-40%');
    var dy = sy === 0 ? '0px' : (sy > 0 ? '118px' : '-118px');
    pb.appendChild(personEl('小明', '👦', '#5b9bd5', '0%', '0px', dA, showHands));
    pb.appendChild(personEl('小红', '👧', '#e8749b', dx, dy, faceB, showHands));
  }

  function l6Next(){
    l6.answered = false;
    l6.dA = rnd(4) * 90;
    l6.v = pick(['face-facing','face-left','back-facing','side-by-side','behind']);
    l6.side = Math.random() < 0.5 ? 'left' : 'right';
    var d = dirOf(l6.dA), opp = dirOf(l6.dA+180), L = dirOf(l6.dA-90), R = dirOf(l6.dA+90);
    var q, ans;
    if (l6.v === 'face-facing'){
      q = '小明面朝 <b>' + d + '</b>，小红和他面对面站着。小红面朝哪个方向？';
      ans = opp;
    } else if (l6.v === 'face-left'){
      q = '小明面朝 <b>' + d + '</b>，小红和他面对面站着。小红的左手边是哪个方向？';
      ans = R;
    } else if (l6.v === 'back-facing'){
      q = '小明面朝 <b>' + d + '</b>，小红和他背对背站着。小红面朝哪个方向？';
      ans = opp;
    } else if (l6.v === 'side-by-side'){
      q = '小明面朝 <b>' + d + '</b>，小红和小明并排站着，都朝同一个方向，小红在小明的' + (l6.side === 'left' ? '左' : '右') + '手边。小明在小红的哪个方向？';
      ans = l6.side === 'left' ? R : L;
    } else {
      q = '小明面朝 <b>' + d + '</b>，小红站在小明的后面。小明在小红的哪个方向？';
      ans = d;
    }
    l6.answer = ans;
    $('q6').innerHTML = q;
    $('f6').className = 'fb'; $('f6').innerHTML = '';
    l6Draw(false);
    dirButtons($('o6'), l6Pick);
    Array.prototype.forEach.call($('o6').children, function(b){ b.disabled = false; });
  }

  function l6Pick(d){
    if (l6.answered) return;
    l6.answered = true; l6.tot++;
    var ok = d === l6.answer;
    if (ok) l6.ok++;
    Array.prototype.forEach.call($('o6').children, function(b){ b.disabled = true; });
    l6Draw(true);
    var fb = $('f6');
    fb.className = 'fb show ' + (ok ? 'ok' : 'no');
    fb.innerHTML = (ok ? '✅ 对！' : '❌ 正确答案是 <b>' + l6.answer + '</b>。') + l6Why();
    score($('sc6'), l6.ok, l6.tot);
  }

  function l6Why(){
    var d = dirOf(l6.dA), opp = dirOf(l6.dA+180), L = dirOf(l6.dA-90), R = dirOf(l6.dA+90);
    if (l6.v === 'face-facing') return '面对面站着，两个人看的方向相反：小明朝' + d + '，小红就朝' + opp + '。';
    if (l6.v === 'back-facing') return '背对背站着，两个人也是朝相反的方向：小明朝' + d + '，小红就朝' + opp + '。';
    if (l6.v === 'face-left') return '小红面朝' + opp + '，她的左手边是' + R + '。秘诀：面对面时，对方的左手边正好是你右手边（小明右手边是' + R + '）。';
    if (l6.v === 'side-by-side') return '并排朝同一个方向时，左右不相反：小明面朝' + d + '，' + (l6.side === 'left' ? '左手边是' + L + '，右手边是' + R + '。小红在小明的左手边，反过来小明就在小红的右手边，也就是' + R + '面。' : '左手边是' + L + '，右手边是' + R + '。小红在小明的右手边，反过来小明就在小红的左手边，也就是' + L + '面。');
    return '小红站在小明后面，两人朝同一个方向（' + d + '）。小明就在小红的前面，也就是' + d + '面。';
  }

  $('n6').addEventListener('click', l6Next);

  /* ---------- init ---------- */
  var start = parseInt(DATA.startLevel || 1, 10);
  go(start);
})();
</script>
</body>
</html>
